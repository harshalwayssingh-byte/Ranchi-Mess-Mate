name: Build MessMate APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract MessMate project
        run: |
          unzip -q MessMate_COMPLETE_UI_Project_FIREBASE_ROLE_LOGIN.zip
          cd MessMateAndroid
          test -f settings.gradle
          test -f app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: MessMateAndroid
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MessMate-debug-apk
          path: MessMateAndroid/app/build/outputs/apk/debug/app-debug.apk
